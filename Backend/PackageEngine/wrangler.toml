name = "iumrah-package-api"
main = "src/index.ts"
compatibility_date = "2026-08-24"

# No SEARCH_SESSIONS binding remains. Keep the historical creation migration so
# Cloudflare can apply the deletion migration to the already-provisioned class.
[[migrations]]
tag = "v1-package-search-session"
new_sqlite_classes = ["PackageSearchSession"]

[[migrations]]
tag = "v2-remove-package-search-session"
deleted_classes = ["PackageSearchSession"]

[vars]
TELEGRAM_BOT_ORIGIN = "https://anonymous-chat-bot.example.workers.dev"
