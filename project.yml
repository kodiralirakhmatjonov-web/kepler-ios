name: iUmra
options:
  bundleIdPrefix: com.iumrah
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "26.0"

settings:
  base:
    SWIFT_VERSION: 5.0
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "2.0.3"
    CURRENT_PROJECT_VERSION: "20182"

packages:
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    exactVersion: 9.2.0

targets:
  iUmra:
    type: application
    platform: iOS
    sources:
      - path: Sources
        excludes:
          # Compiled explicitly below so the data-sphere shaders are guaranteed
          # to land in the app's default Metal library under XcodeGen.
          - Core/Components/IumrahDataSphereShaders.metal
          # Legacy on-device Booking/Expedia hotel scrapers are intentionally
          # outside the production target. Hotel pricing comes from the 48h
          # server catalog cache maintained by iumrah Business.
          - HotelPricing/HotelLivePriceSearchService.swift
          - HotelPricing/HotelPriceBotRunner.swift
          - HotelPricing/HotelPriceBotScripts.swift
          - HotelPricing/HotelPriceProvider.swift
          - HotelPricing/HotelPriceTextParser.swift
      - path: Sources/Core/Components/IumrahDataSphereShaders.metal
        buildPhase: sources
      - path: Resources/Assets.xcassets
        buildPhase: resources
      - path: Resources/Animations
        buildPhase: resources
      - path: Resources/AlternateIcons
        buildPhase: resources
      - path: Resources/en.lproj
        buildPhase: resources
      - path: Resources/ru.lproj
        buildPhase: resources
      - path: Resources/uz.lproj
        buildPhase: resources
      - path: Resources/uz-Cyrl.lproj
        buildPhase: resources
      - path: Resources/ar.lproj
        buildPhase: resources
      - path: Resources/fr.lproj
        buildPhase: resources
      - path: Resources/tr.lproj
        buildPhase: resources
      - path: Resources/id.lproj
        buildPhase: resources
      - path: Resources/ms.lproj
        buildPhase: resources
      - path: Resources/kk.lproj
        buildPhase: resources
      - path: Resources/bn.lproj
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.iumrah.app
        PRODUCT_NAME: iUmra
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Resources/iUmra.entitlements
        # App signing must remain target-scoped. Passing these as global xcodebuild
        # overrides also applies the App Store profile to Swift Package resource
        # targets (GoogleSignIn), which do not support provisioning profiles.
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: "$(IUMRAH_APPLE_TEAM_ID)"
        CODE_SIGN_IDENTITY: "Apple Distribution"
        PROVISIONING_PROFILE_SPECIFIER: "$(IUMRAH_PROFILE_NAME)"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: "AppIconBlue AppIconCyan AppIconDeepBlue AppIconWorld AppIconMakkah"
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
    dependencies:
      - package: GoogleSignIn
        products:
          - GoogleSignIn
          - GoogleSignInSwift
    scheme:
      testTargets: []
