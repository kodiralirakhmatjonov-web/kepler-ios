name: Iumrah — Prepare iOS Signing

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: iumrah-ios-signing-prepare
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: macos-26
    env:
      APP_BUNDLE_ID: com.iumrah.app
      WIDGET_BUNDLE_ID: com.iumrah.app.widgets
      WIDGET_PROFILE_SOURCE: Resources/Provisioning/iumrah_Widgets_App_Store.mobileprovision

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate existing signing sources
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          IOS_SIGNING_KEY_PASSWORD: ${{ secrets.IOS_SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          for name in APPLE_TEAM_ID IOS_SIGNING_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "Missing GitHub secret: $name"
              exit 1
            fi
          done

          test -f Signing/distribution-private-key.enc || {
            echo "Missing Signing/distribution-private-key.enc"
            exit 1
          }

          test -f "$WIDGET_PROFILE_SOURCE" || {
            echo "Missing widget profile: $WIDGET_PROFILE_SOURCE"
            exit 1
          }

          APP_PROFILE=""
          mkdir -p "$RUNNER_TEMP/signing-scan"

          shopt -s nullglob
          for candidate in Signing/*.mobileprovision; do
            decoded="$RUNNER_TEMP/signing-scan/$(basename "$candidate").plist"
            if ! security cms -D -i "$candidate" > "$decoded" 2>/dev/null; then
              continue
            fi

            app_id=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$decoded" 2>/dev/null || true)
            team_id=$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' "$decoded" 2>/dev/null || true)
            get_task_allow=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:get-task-allow' "$decoded" 2>/dev/null || true)

            if [ "$team_id" = "$APPLE_TEAM_ID" ] && \
               [ "$app_id" = "${APPLE_TEAM_ID}.${APP_BUNDLE_ID}" ] && \
               [ "$get_task_allow" = "false" ]; then
              APP_PROFILE="$candidate"
              break
            fi
          done

          test -n "$APP_PROFILE" || {
            echo "No App Store profile for ${APPLE_TEAM_ID}.${APP_BUNDLE_ID} found in Signing/."
            exit 1
          }

          APP_PLIST="$RUNNER_TEMP/app-profile.plist"
          WIDGET_PLIST="$RUNNER_TEMP/widget-profile.plist"

          security cms -D -i "$APP_PROFILE" > "$APP_PLIST"
          security cms -D -i "$WIDGET_PROFILE_SOURCE" > "$WIDGET_PLIST"

          APP_TEAM=$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' "$APP_PLIST")
          APP_IDENTIFIER=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$APP_PLIST")
          APP_GET_TASK_ALLOW=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:get-task-allow' "$APP_PLIST")

          WIDGET_TEAM=$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' "$WIDGET_PLIST")
          WIDGET_IDENTIFIER=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$WIDGET_PLIST")
          WIDGET_GET_TASK_ALLOW=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:get-task-allow' "$WIDGET_PLIST")

          test "$APP_TEAM" = "$APPLE_TEAM_ID"
          test "$WIDGET_TEAM" = "$APPLE_TEAM_ID"
          test "$APP_IDENTIFIER" = "${APPLE_TEAM_ID}.${APP_BUNDLE_ID}"
          test "$WIDGET_IDENTIFIER" = "${APPLE_TEAM_ID}.${WIDGET_BUNDLE_ID}"
          test "$APP_GET_TASK_ALLOW" = "false"
          test "$WIDGET_GET_TASK_ALLOW" = "false"

          # Validate the app profile capabilities that the production app needs.
          APP_APS=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:aps-environment' "$APP_PLIST" 2>/dev/null || true)
          APP_SIGNIN=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:com.apple.developer.applesignin:0' "$APP_PLIST" 2>/dev/null || true)
          test "$APP_APS" = "production" || { echo "App profile is missing production APNs."; exit 1; }
          test "$APP_SIGNIN" = "Default" || { echo "App profile is missing Sign in with Apple."; exit 1; }

          # Extract the Apple Distribution certificate embedded in both profiles
          # and prove that both profiles use the SAME existing certificate.
          APP_PROFILE_PLIST="$APP_PLIST" \
          WIDGET_PROFILE_PLIST="$WIDGET_PLIST" \
          CERT_DER="$RUNNER_TEMP/distribution-certificate.der" \
          python3 - <<'PYCODE'
          import os, plistlib
          from pathlib import Path

          with Path(os.environ["APP_PROFILE_PLIST"]).open("rb") as f:
              app = plistlib.load(f)
          with Path(os.environ["WIDGET_PROFILE_PLIST"]).open("rb") as f:
              widget = plistlib.load(f)

          app_certs = app.get("DeveloperCertificates") or []
          widget_certs = widget.get("DeveloperCertificates") or []
          if not app_certs or not widget_certs:
              raise SystemExit("A provisioning profile contains no DeveloperCertificates")
          if app_certs[0] != widget_certs[0]:
              raise SystemExit("App and widget profiles are signed for different Apple Distribution certificates")

          Path(os.environ["CERT_DER"]).write_bytes(app_certs[0])
          PYCODE

          openssl x509 \
            -inform DER \
            -in "$RUNNER_TEMP/distribution-certificate.der" \
            -out "$RUNNER_TEMP/distribution-certificate.pem"

          # Decrypt the EXISTING private key only for validation on this ephemeral runner.
          openssl enc \
            -d \
            -aes-256-cbc \
            -pbkdf2 \
            -iter 200000 \
            -in Signing/distribution-private-key.enc \
            -out "$RUNNER_TEMP/distribution-private-key.pem" \
            -pass env:IOS_SIGNING_KEY_PASSWORD

          KEY_FP=$(openssl pkey -in "$RUNNER_TEMP/distribution-private-key.pem" -pubout 2>/dev/null | openssl sha256)
          CERT_FP=$(openssl x509 -in "$RUNNER_TEMP/distribution-certificate.pem" -pubkey -noout 2>/dev/null | openssl sha256)

          test "$KEY_FP" = "$CERT_FP" || {
            echo "Existing encrypted private key does not match the existing Apple Distribution certificate."
            exit 1
          }

          CERT_SHA256=$(openssl x509 -in "$RUNNER_TEMP/distribution-certificate.pem" -noout -fingerprint -sha256 | sed 's/^sha256 Fingerprint=//')
          CERT_SUBJECT=$(openssl x509 -in "$RUNNER_TEMP/distribution-certificate.pem" -noout -subject | sed 's/^subject=//')
          CERT_NOT_AFTER=$(openssl x509 -in "$RUNNER_TEMP/distribution-certificate.pem" -noout -enddate | sed 's/^notAfter=//')

          APP_PROFILE_NAME=$(/usr/libexec/PlistBuddy -c 'Print :Name' "$APP_PLIST")
          APP_PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$APP_PLIST")
          APP_PROFILE_EXPIRY=$(/usr/libexec/PlistBuddy -c 'Print :ExpirationDate' "$APP_PLIST")

          WIDGET_PROFILE_NAME=$(/usr/libexec/PlistBuddy -c 'Print :Name' "$WIDGET_PLIST")
          WIDGET_PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$WIDGET_PLIST")
          WIDGET_PROFILE_EXPIRY=$(/usr/libexec/PlistBuddy -c 'Print :ExpirationDate' "$WIDGET_PLIST")

          BUNDLE_DIR="$RUNNER_TEMP/prepared-signing"
          mkdir -p "$BUNDLE_DIR"
          cp "$APP_PROFILE" "$BUNDLE_DIR/app.mobileprovision"
          cp "$WIDGET_PROFILE_SOURCE" "$BUNDLE_DIR/widget.mobileprovision"

          cat > "$BUNDLE_DIR/manifest.json" <<JSON
          {
            "team_id": "${APPLE_TEAM_ID}",
            "app_bundle_id": "${APP_BUNDLE_ID}",
            "widget_bundle_id": "${WIDGET_BUNDLE_ID}",
            "app_profile_name": "${APP_PROFILE_NAME}",
            "app_profile_uuid": "${APP_PROFILE_UUID}",
            "app_profile_expiry": "${APP_PROFILE_EXPIRY}",
            "widget_profile_name": "${WIDGET_PROFILE_NAME}",
            "widget_profile_uuid": "${WIDGET_PROFILE_UUID}",
            "widget_profile_expiry": "${WIDGET_PROFILE_EXPIRY}",
            "certificate_sha256": "${CERT_SHA256}",
            "certificate_subject": "${CERT_SUBJECT}",
            "certificate_not_after": "${CERT_NOT_AFTER}"
          }
          JSON

          rm -f \
            "$RUNNER_TEMP/distribution-private-key.pem" \
            "$RUNNER_TEMP/distribution-certificate.pem" \
            "$RUNNER_TEMP/distribution-certificate.der"

          echo "Signing validation passed."
          echo "No Apple certificate or provisioning profile was created or revoked."
          echo "App profile: $APP_PROFILE_NAME"
          echo "Widget profile: $WIDGET_PROFILE_NAME"
          echo "Certificate SHA-256: $CERT_SHA256"

      - name: Upload prepared signing bundle
        uses: actions/upload-artifact@v4
        with:
          name: iumrah-ios-signing-bundle
          path: ${{ runner.temp }}/prepared-signing
          if-no-files-found: error
          retention-days: 90

      - name: Summary
        run: |
          {
            echo "## iOS signing is prepared"
            echo
            echo "- Existing App Store app profile validated"
            echo "- Existing App Store widget profile validated"
            echo "- Both profiles use the same existing Apple Distribution certificate"
            echo "- Existing encrypted private key matches that certificate"
            echo "- No certificate/profile was created, renewed, or revoked"
            echo "- TestFlight can now consume the prepared signing artifact"
          } >> "$GITHUB_STEP_SUMMARY"
