name: Deploy iumrah Package Engine

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend/PackageEngine
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
      D1_NAME: iumrah-hotels

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify deploy secrets
        env:
          IGNAV_API_KEY: ${{ secrets.IGNAV_API_KEY }}
          DEVSMS_API_TOKEN: ${{ secrets.DEVSMS_API_TOKEN }}
        run: |
          set -euo pipefail
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_ZONE_ID IGNAV_API_KEY DEVSMS_API_TOKEN; do
            if [ -z "${!name:-}" ]; then
              echo "Missing GitHub secret: $name"
              exit 1
            fi
          done
          echo "Required deployment secrets are present."

      - name: Verify DevSMS API token
        env:
          DEVSMS_API_TOKEN: ${{ secrets.DEVSMS_API_TOKEN }}
        run: |
          set -euo pipefail
          RESPONSE=$(curl -fsS "https://devsms.uz/api/get_balance.php" \
            -H "Authorization: Bearer ${DEVSMS_API_TOKEN}" \
            -H "Accept: application/json")
          echo "$RESPONSE" | jq -e '.success == true' >/dev/null
          echo "DevSMS API token is valid."

      - name: Install dependencies
        run: npm install

      - name: Typecheck and tests
        run: |
          npm run typecheck
          npm test

      - name: Resolve EXISTING iumrah-hotels D1
        id: d1
        run: |
          set -euo pipefail
          LIST=$(curl -fsS \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json")

          DB_ID=$(printf '%s' "$LIST" | jq -r --arg NAME "$D1_NAME" \
            '.result[]? | select(.name == $NAME) | (.uuid // .id)' | head -n 1)

          if [ -z "$DB_ID" ] || [ "$DB_ID" = "null" ]; then
            echo "Existing D1 database '$D1_NAME' was not found. Refusing to create a second hotel database."
            exit 1
          fi

          echo "Using existing D1: $D1_NAME ($DB_ID)"
          echo "database_id=$DB_ID" >> "$GITHUB_OUTPUT"

      - name: Generate production Wrangler config
        run: |
          node scripts/render-config.mjs "${{ steps.d1.outputs.database_id }}" "$CLOUDFLARE_ZONE_ID"
          node -e "JSON.parse(require('fs').readFileSync('wrangler.generated.jsonc','utf8')); console.log('Wrangler config JSON OK')"

      - name: Apply Package Engine schema to existing D1
        run: npx wrangler d1 execute HOTELS_DB --remote --file migrations/0006_package_primary_hotels.sql --config wrangler.generated.jsonc

      - name: Apply DevSMS phone verification schema
        run: npx wrangler d1 execute HOTELS_DB --remote --file migrations/0008_devsms_phone_verification.sql --config wrangler.generated.jsonc

      - name: Verify Package Engine table
        run: npx wrangler d1 execute HOTELS_DB --remote --command "SELECT COUNT(*) AS configured FROM package_primary_hotels;" --config wrangler.generated.jsonc

      - name: Deploy Package Engine routes
        run: npx wrangler deploy --config wrangler.generated.jsonc

      - name: Install Ignav Worker secret
        env:
          IGNAV_API_KEY: ${{ secrets.IGNAV_API_KEY }}
        run: |
          set -euo pipefail
          printf '%s' "$IGNAV_API_KEY" | npx wrangler secret put IGNAV_API_KEY --config wrangler.generated.jsonc

      - name: Install DevSMS Worker secret
        env:
          DEVSMS_API_TOKEN: ${{ secrets.DEVSMS_API_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$DEVSMS_API_TOKEN" | npx wrangler secret put DEVSMS_API_TOKEN --config wrangler.generated.jsonc

      - name: Verify Package Engine and Ignav
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6; do
            if RESPONSE=$(curl -fsS "https://iumrah.app/api/package/health"); then
              echo "$RESPONSE" | jq .
              if echo "$RESPONSE" | jq -e '
                .ok == true and
                .hotelsDbConfigured == true and
                .flightProvider == "ignav" and
                .flightProviderConfigured == true and
                .smsProvider == "devsms" and
                .smsProviderConfigured == true
              ' >/dev/null; then
                echo "iumrah Package Engine is online; Ignav and DevSMS are configured."
                exit 0
              fi
            fi
            sleep 5
          done
          echo "Package Engine health check failed: Ignav or DevSMS is not configured."
          exit 1
